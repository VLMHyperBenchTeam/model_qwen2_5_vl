[project]
name = "model-qwen2-5-vl"
version = "0.1.3.dev0"
description = "Qwen 2.5-VL model wrapper and evaluation scripts"
readme = "README.md"
requires-python = ">=3.10"
# В релизе используем конкретную версию model-interface с GitHub
dependencies = [
    "model-interface",
    "qwen-vl-utils>=0.0.11",
    "torch>=2.4,<2.8",
    "torchvision",
    "transformers>=4.53.0",
    "accelerate>=0.26"
]
authors = [
    {name = "Anton Shiryaev", email = "med.phisiker@gmail.com"}
]

[project.urls]
Repository = "https://github.com/VLMHyperBenchTeam/model_qwen2.5-vl"
Homepage = "https://github.com/VLMHyperBenchTeam"

[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
model-interface = { git = "https://github.com/VLMHyperBenchTeam/model_interface.git", tag = "0.1.3.dev1" }
